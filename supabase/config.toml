# Local stack config. The CLI also accepts config.jsonc, but docs/backend.md names config.toml, so this is the one file.
project_id = "brick-web"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Mailpit: every auth email sent locally lands at http://127.0.0.1:54324
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
# The auth app. Invite and recovery links come back here.
site_url = "http://127.0.0.1:5174"
additional_redirect_urls = ["http://127.0.0.1:5174/**", "http://127.0.0.1:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# No public signups (CLAUDE.md §2). Admin invites still work.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
# Password login must stay on; public signup is off via [auth] enable_signup.
enabled = true
double_confirm_changes = true
enable_confirmations = true # email changes (and signups, which are off) must be confirmed; restart the stack to apply

# Puts the `permissions` claim in every JWT (docs/backend.md §3).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

# Auth emails. The owner pastes the same HTML and subjects into the dashboard for production (docs/backend.md §10).
# Links go to the auth app with the token hash: /invite?token=… and /reset?token=… (apps/auth/src/router.tsx).
[auth.email.template.invite]
subject = "You're invited to BrickBot"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your BrickBot password"
content_path = "./supabase/templates/recovery.html"

[edge_runtime]
enabled = true
policy = "per_worker"

# The functions check the caller's JWT themselves and then the member's permission in the database.
[functions.email-2fa]
enabled = true
verify_jwt = true

[functions.admin-users]
enabled = true
verify_jwt = true

[functions.media]
enabled = true
verify_jwt = true
